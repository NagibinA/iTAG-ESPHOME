  on_boot:
    then:
      - lambda: |-
          ESP_LOGI("main", "🔍 Запущен в ПАССИВНОМ режиме");

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: "ВАШ_КЛЮЧ"

ota:
  password: "ВАШ_ПАРОЛЬ"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esphome:
  name: tracker-ble
  friendly_name: tracker ble
  on_boot:
    then:
      - lambda: |-
          ESP_LOGI("main", "🔍 Запущен в ПАССИВНОМ режиме");


captive_portal:

esp32_ble_tracker:
  scan_parameters:
    interval: 300ms
    window: 300ms
    active: false
    continuous: true
  on_ble_advertise:
    then:
      - lambda: |-
          if (x.address_str() == "5B:86:CF:15:45:BA") {
            int now = millis();
            id(itag_last_seen) = now;
            id(itag_passive_rssi_value) = x.get_rssi();
            
            ESP_LOGI("iTAG", "📡 Рекламный пакет! RSSI: %d dBm", x.get_rssi());
            
            // Автоматическое включение ТОЛЬКО если автоматика ВКЛ
            if (id(auto_mode).state && !id(itag_active_mode).state) {
              ESP_LOGI("iTAG", "🔄 Автоматика: включаю активный режим");
              id(itag_active_mode).turn_on();
            } else if (!id(auto_mode).state) {
              ESP_LOGD("iTAG", "Автоматика выключена, активный режим не включаю");
            }
            
            // Если активный режим выключен - обновляем RSSI из пассивного сканирования
            if (!id(itag_active_mode).state) {
              id(itag_rssi).publish_state(x.get_rssi());
            }
          }

ble_client:
  - mac_address: "5B:86:CF:15:45:BA"
    id: itag_device
    auto_connect: false
    on_connect:
      then:
        - binary_sensor.template.publish:
            id: itag_presence
            state: ON
        - lambda: |-
            ESP_LOGI("iTAG", "✅ Активный режим: подключен");
            id(itag_active_rssi).update();
            id(itag_battery_raw).update();
    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: itag_presence
            state: OFF
        - lambda: |-
            ESP_LOGI("iTAG", "❌ Потеря связи с брелоком");
            // Выключаем ВСЕГДА при потере связи (автоматика НЕ влияет)
            if (id(itag_active_mode).state) {
              ESP_LOGI("iTAG", "🔴 Выключаю активный режим");
              id(itag_active_mode).turn_off();
            }

globals:
  - id: itag_last_seen
    type: int
    restore_value: no
    initial_value: '0'
  - id: itag_passive_rssi_value
    type: int
    restore_value: no
    initial_value: '-120'
  - id: battery_100_pending
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: battery_100_start_time
    type: unsigned long
    initial_value: '0'
    restore_value: no

binary_sensor:
  - platform: template
    id: itag_button
    name: "Кнопка"
    device_class: power
    filters:
      - delayed_off: 200ms

  - platform: template
    id: itag_presence
    name: "Брелок находится"
    device_class: presence
    lambda: |-
      if (id(itag_active_mode).state && id(itag_device).connected()) {
        return true;
      }
      if (id(itag_last_seen) > 0 && (millis() - id(itag_last_seen)) < 60000) {
        return true;
      }
      return false;

switch:
  # Основной переключатель активного режима
  - platform: template
    name: "Активный режим"
    id: itag_active_mode
    icon: "mdi:bluetooth"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          ESP_LOGI("iTAG", "🔵 Включение активного режима");
      - ble_client.connect: itag_device
      - delay: 5s
      - lambda: |-
          if (id(itag_device).connected()) {
            ESP_LOGI("iTAG", "✅ Активный режим включен");
          } else {
            ESP_LOGW("iTAG", "⚠️ Не удалось подключиться");
          }
    turn_off_action:
      - lambda: |-
          ESP_LOGI("iTAG", "🔴 Выключение активного режима");
      - ble_client.disconnect: itag_device
      - delay: 500ms
      - lambda: |-
          ESP_LOGI("iTAG", "Активный режим выключен, перехожу в пассивный режим");

  # Переключатель автоматики (в настройках)
  - platform: template
    name: "Автоматика"
    id: auto_mode
    icon: "mdi:auto-fix"
    optimistic: true
    restore_mode: ALWAYS_ON
    entity_category: config
    turn_on_action:
      - lambda: |-
          ESP_LOGI("iTAG", "🤖 Автоматика ВКЛЮЧЕНА");
    turn_off_action:
      - lambda: |-
          ESP_LOGI("iTAG", "🤖 Автоматика ВЫКЛЮЧЕНА");

  # Поиск брелока
  - platform: template
    name: "Найти брелок"
    id: find_itag
    icon: "mdi:map-marker"
    turn_on_action:
      - if:
          condition:
            - switch.is_on: itag_active_mode
            - lambda: 'return id(itag_device).connected();'
          then:
            - ble_client.ble_write:
                id: itag_device
                service_uuid: '1802'
                characteristic_uuid: '2a06'
                value: [0x01]
            - delay: 500ms
            - ble_client.ble_write:
                id: itag_device
                service_uuid: '1802'
                characteristic_uuid: '2a06'
                value: [0x00]
            - lambda: |-
                ESP_LOGI("iTAG", "🔔 Сигнал поиска отправлен");
          else:
            - lambda: |-
                ESP_LOGW("iTAG", "⚠️ Активный режим выключен или нет подключения");
    turn_off_action:
      - lambda: |-
          ESP_LOGD("iTAG", "Поиск отключен");

  # Перезагрузка ESP32
  - platform: restart
    name: "Перезагрузить ESP32"
    id: restart_esp32
    entity_category: config

sensor:
  - platform: template
    name: "RSSI"
    id: itag_rssi
    unit_of_measurement: "dBm"
    icon: "mdi:signal"
    device_class: signal_strength
    update_interval: 30s
    lambda: |-
      if (id(itag_active_mode).state && id(itag_device).connected()) {
        float active_rssi = id(itag_active_rssi).state;
        if (!isnan(active_rssi)) {
          return active_rssi;
        }
      }
      if (id(itag_last_seen) > 0 && (millis() - id(itag_last_seen)) < 60000) {
        return id(itag_passive_rssi_value);
      }
      return -120;

  - platform: template
    id: itag_passive_rssi
    internal: true
    unit_of_measurement: "dBm"
    lambda: |-
      return id(itag_passive_rssi_value);

  - platform: ble_client
    type: rssi
    ble_client_id: itag_device
    id: itag_active_rssi
    name: "RSSI Active"
    update_interval: 5s
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(itag_active_mode).state && id(itag_device).connected()) {
              id(itag_rssi).publish_state(x);
              ESP_LOGD("iTAG", "Активный RSSI: %d dBm", x);
            }

  - platform: ble_client
    type: characteristic
    ble_client_id: itag_device
    name: "Button_flag"
    internal: true
    service_uuid: 'ffe0'
    characteristic_uuid: 'ffe1'
    notify: true
    update_interval: never
    on_notify:
      then:
        - binary_sensor.template.publish:
            id: itag_button
            state: ON
        - binary_sensor.template.publish:
            id: itag_button
            state: OFF
        - lambda: |-
            ESP_LOGI("iTAG", "🔘 КНОПКА НАЖАТА!");

  # Сырой сенсор батареи (получает нотификации)
  - platform: ble_client
    type: characteristic
    ble_client_id: itag_device
    id: itag_battery_raw
    internal: true
    service_uuid: '180f'
    characteristic_uuid: '2a19'
    notify: true
    on_notify:
      then:
        - lambda: |-
            float battery_value = x;
            ESP_LOGD("iTAG", "🔋 Получено значение: %.0f%%", battery_value);
            
            // Если значение НЕ 100% - публикуем сразу И отменяем ожидание 100
            if (battery_value < 100.0) {
              if (id(battery_100_pending)) {
                ESP_LOGD("iTAG", "⚠️ Отменяю ожидание 100%% (пришло реальное значение)");
                id(battery_100_pending) = false;
                id(battery_100_start_time) = 0;
              }
              id(itag_battery).publish_state(battery_value);
              ESP_LOGI("iTAG", "🔋 Батарея: %.0f%% (мгновенно)", battery_value);
            } 
            // Если значение 100%
            else {
              // Если уже ждём 100 - ничего не делаем
              if (id(battery_100_pending)) {
                ESP_LOGD("iTAG", "🔋 Повторное 100%%, продолжаю ожидание");
              } 
              // Если не ждём - запускаем ожидание
              else {
                ESP_LOGD("iTAG", "🔋 Получено 100%%, начинаю ожидание 10 секунд");
                id(battery_100_pending) = true;
                id(battery_100_start_time) = millis();
              }
            }

  # Публичный сенсор батареи
  - platform: template
    name: "Батарейка"
    id: itag_battery
    unit_of_measurement: '%'
    icon: "mdi:battery"
    device_class: battery
    accuracy_decimals: 0

# Интервал для проверки таймера (каждую секунду)
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(battery_100_pending) && id(battery_100_start_time) > 0) {
            if (millis() - id(battery_100_start_time) >= 10000) {
              ESP_LOGI("iTAG", "🔋 Прошло 10 секунд без значений <100%%, публикую 100%%");
              id(itag_battery).publish_state(100.0);
              id(battery_100_pending) = false;
              id(battery_100_start_time) = 0;
            }
          }
